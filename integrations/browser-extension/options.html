<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fallow options</title>
    <style>
      body {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        background: #f5f0e6;
        color: #221f1b;
        margin: 0;
        padding: 20px;
        width: 360px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        margin: 6px 0 12px;
        color: #5f584e;
        font-size: 14px;
      }
      label {
        display: block;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5f584e;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #c7bda8;
        background: #ede6d8;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 9px 12px;
        border: 1px solid #221f1b;
        background: #221f1b;
        color: #f5f0e6;
        cursor: pointer;
      }
      .status {
        font-size: 13px;
        color: #4f6b3a;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Fallow</h1>
    <p>The extension talks to the Fallow app running on your machine. Sites, pause length and the daily budget are set in the app's Settings page.</p>
    <label for="base">App address</label>
    <input id="base" type="url" placeholder="http://localhost:3000" />
    <button id="save">Save</button><span class="status" id="status"></span>
    <button id="clear" style="background: transparent; color: #221f1b; margin-left: 8px">Clear snoozes and mutes</button>
    <script src="options.js"></script>
  </body>
</html>
